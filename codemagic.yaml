workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: appt3p
    scripts:
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - appt3p/build/app/outputs/flutter-apk/*.apk
