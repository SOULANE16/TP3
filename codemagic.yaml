workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: |
          cd appt3p
          flutter pub get
      - name: Build APK
        script: |
          cd appt3p
          flutter build apk --release
    artifacts:
      - appt3p/build/app/outputs/flutter-apk/*.apk
